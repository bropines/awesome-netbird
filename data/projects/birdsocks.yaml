name: BirdSocks
description: >-
  An unofficial Android client that runs the NetBird daemon as a userspace node
  and gives its network to apps through a local SOCKS5 proxy, a DNS proxy or an
  optional VPN mode, so it can run alongside another VPN or ad-blocker.
author: bropines
category: Apps
url: https://github.com/bropines/birdsocks
